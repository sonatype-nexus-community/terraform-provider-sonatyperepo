# Prepares the input that Sonatype Lifecycle evaluates for a Pull Request - Tier 1.
#
# See https://contribute.sonatype.com/docs/standards/pull-request-ci/
#
# Runs on every Pull Request, including those from forks, so it has NO access to secrets. It only
# produces data (the `lifecycle-scan-input` artifact). The evaluation is done by
# lifecycle-evaluate.yml, which runs trusted code and treats the artifact as data.
#
# It is separate from Test (Untrusted) so that the Lifecycle check does not wait for the tests.
name: Prepare Lifecycle Scan Input

on:
    pull_request:
        types: [opened, synchronize, reopened]

permissions: {}

# A new commit on a Pull Request cancels the run for the previous one.
concurrency:
    group: prepare-lifecycle-scan-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    prepare:
        name: Prepare Lifecycle Scan Input
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
              with:
                  go-version-file: 'go.mod'
                  cache: true

            - name: Generate go.list
              run: |
                  mkdir lifecycle-scan-input
                  go list -f '{{define "M"}}{{.Path}} {{.Version}}{{end}}{{with .Module}}{{if not .Main}}{{if .Replace}}{{template "M" .Replace}}{{else}}{{template "M" .}}{{end}}{{end}}{{end}}' -compiled -deps | sort -u > lifecycle-scan-input/go.list

            - name: Upload scan input
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: lifecycle-scan-input
                  path: lifecycle-scan-input/go.list
                  if-no-files-found: error
                  retention-days: 7
