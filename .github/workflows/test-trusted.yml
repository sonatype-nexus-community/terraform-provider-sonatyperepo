# Terraform Provider testing workflow.
name: Test (Trusted)

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
on:
    push:
        branches:
            - main
        paths-ignore:
            - 'CHANGELOG.md'
            - 'README.md'
    workflow_run:
      workflows: ["Test (Untrusted)"]
      types: [completed]
    workflow_dispatch:
      inputs:
        branch:
          description: 'Branch to run tests against'
          required: true
          default: 'main'
          type: string

env:
    LC_APPLICATION_ID: terraform-provider-sonatyperepo
    NEXUS_SECURITY_RANDOMPASSWORD: "false"
    INSTALL4J_ADD_VM_PARAMS: "-Dnexus.licenseFile=${{ github.workspace }}/license.lic"
    # See https://github.com/sonatype-nexus-community/terraform-provider-sonatyperepo/issues/285.
    # Single pinned Sonatype IQ Server release. Newer releases exist (e.g. IQ Server 206, per
    # https://help.sonatype.com/en/download-and-install-iq-server.html), but 1.204.2-01 is the
    # newest version confirmed to actually resolve as a downloadable
    # nexus-iq-server-*-bundle.tar.gz from download.sonatype.com/clm/server/ at the time this was
    # written - the bundle artifact appears to lag behind the sonatype/nexus-iq-server Docker
    # tags. Re-check for a newer working bundle periodically.
    NXIQ_VERSION: "1.204.2-01"

jobs:
    sonatype:
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.ref_name != 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
        name: Sonatype Scan
        runs-on: ubuntu-latest
        permissions:
          contents: read
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}
              
            - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
              with:
                go-version-file: 'go.mod'
                cache: true
              
            - name: Generate go.list
              run:
                    go list -f '{{define "M"}}{{.Path}} {{.Version}}{{end}}{{with .Module}}{{if not .Main}}{{if .Replace}}{{template "M" .Replace}}{{else}}{{template "M" .}}{{end}}{{end}}{{end}}' -compiled -deps| sort -u > go.list
              
            - name: Sonatype Lifecycle Evaluation
              id: evaluate
              uses: sonatype/actions/evaluate@v1
              with:
                    iq-server-url: ${{ vars.SONATYPE_PLATFORM_URL }}
                    username: ${{ secrets.SONATYPE_LIFECYCLE_USERNAME }}
                    password: ${{ secrets.SONATYPE_LIFECYCLE_PASSWORD }}
                    application-id: ${{ env.LC_APPLICATION_ID }}
                    scan-targets: 'go.list'
                    stage: build

    # Run acceptance tests in a matrix with Terraform CLI versions
    test-parallel:
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.ref_name != 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
        name: Acc. Tests (NXRM ${{ matrix.nxrm }} + TF ${{ matrix.terraform }})
        needs: 
            - sonatype
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
          contents: read
        strategy:
            fail-fast: false
            matrix:
                nxrm:
                    - '3.82.0-08' # Enters Ext Maintenance 09-Jul-2026
                    - '3.83.2-01'
                    - '3.84.1-01' 
                    - '3.85.0-03'
                    - '3.86.2-01'
                    - '3.87.1-01'
                    - '3.88.0-08' 
                    - '3.89.1-02'
                    - '3.90.1-01'
                    - '3.91.0-07'
                    - '3.92.0-03'
                    - '3.93.0-06' 
                    - '3.94.1-06'
                    - '3.95.1-01' # LATEST
                # list whatever Terraform versions here you would like to support
                terraform:
                    - '1.7.*' # Minimum
                    # - '1.8.*'
                    # - '1.9.*'
                    # - '1.10.*'
                    # - '1.11.*' 
                    # - '1.12.*'
                    # - '1.13.*' 
                    # - '1.14.*'
                    - '1.15.*' # Latest
        steps:
            - name: Set Clean TF Version
              run: |
                ORIG="${{ matrix.terraform }}"
                TF_SAFE_VERSION="${ORIG//\*/}"
                echo "TF_SAFE_VERSION=$TF_SAFE_VERSION" >> "$GITHUB_ENV"
                
            - name: Checkout Source
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

            - name: Setup PostgreSQL
              id: setup-postgresql
              uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee # v8
              with:
                postgres-version: 17
            
            - name: Create database
              run: |
                psql -c "CREATE USER nexus WITH PASSWORD 'somepassword';"
                psql -c "CREATE DATABASE nexus OWNER nexus ENCODING 'UTF8' LC_COLLATE = 'en_US.UTF-8' LC_CTYPE = 'en_US.UTF-8' TEMPLATE template0;"
                psql -d nexus -c "CREATE SCHEMA nexus AUTHORIZATION nexus;"
                psql -d nexus -c "GRANT ALL PRIVILEGES ON DATABASE nexus TO nexus; GRANT ALL PRIVILEGES ON SCHEMA nexus TO nexus;"
                psql -d nexus -c "CREATE EXTENSION pg_trgm SCHEMA nexus;"
              env:
                PGSERVICE: ${{ steps.setup-postgresql.outputs.service-name }}

            - name: Download & Unpack Sonatype Nexus Repository Manager
              run: |
                  echo "${{ secrets.NXRM_LICENSE }}" | base64 -d > ${{ github.workspace }}/license.lic
                  wget https://download.sonatype.com/nexus/3/nexus-${{ matrix.nxrm }}-linux-x86_64.tar.gz 
                  tar xvz --keep-directory-symlink -f nexus-${{ matrix.nxrm }}-linux-x86_64.tar.gz 
                  sed -i '1s/^.*$/#!\/bin\/bash/' ${{ github.workspace }}/nexus-${{ matrix.nxrm }}/bin/nexus
                  head -5 ${{ github.workspace }}/nexus-${{ matrix.nxrm }}/bin/nexus

            - name: Download & Unpack Sonatype IQ Server
              run: |
                  wget --max-redirect=0 https://download.sonatype.com/clm/server/nexus-iq-server-${{ env.NXIQ_VERSION }}-bundle.tar.gz
                  mkdir ${{ github.workspace }}/nxiq
                  tar xvz -f nexus-iq-server-${{ env.NXIQ_VERSION }}-bundle.tar.gz -C ${{ github.workspace }}/nxiq
                  echo "licenseFile: ${{ github.workspace }}/license.lic" >> ${{ github.workspace }}/nxiq/config.yml

            - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
              with:
                distribution: 'temurin'
                java-version: '25'

            - name: Start Sonatype IQ Server
              run: |
                  # Use the bundle's own jvm.options (via @jvm.options) rather than a hand-copied
                  # flag list, since Sonatype adds/changes required flags between releases (e.g.
                  # --enable-native-access, needed from JDK 22+ per JEP 472, isn't in older
                  # copies of this list). See
                  # https://help.sonatype.com/en/java-compatibility-matrix.html - IQ Server 204+
                  # requires Java 25.
                  java @jvm.options -jar nexus-iq-server-*.jar server config.yml 2> stderr.log &
              working-directory: "${{ github.workspace }}/nxiq"

            - name: Wait for Sonatype IQ Server to be ready
              run: |
                  set +e
                  sleep 20
                  READY=false
                  for i in {1..30}; do
                    STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8071/healthcheck?pretty=true")
                    CURL_EXIT=$?

                    echo "CURL Exit Code: $CURL_EXIT"

                    if [ "$CURL_EXIT" -eq 0 ]; then
                      if [ "$STATUS" -eq 200 ]; then
                          echo "✅ Received 200 OK from http://localhost:8071/healthcheck?pretty=true"
                          READY=true
                          break
                      else
                          echo "⏳ Waiting for 200 OK... Current status: $STATUS for http://localhost:8071/healthcheck?pretty=true"
                          sleep 5
                      fi
                    else
                      echo "⚠️ curl returned unexpected exit code $CURL_EXIT. Retrying... (attempt $i/30)"
                      sleep 5
                    fi
                  done
                  if [ "$READY" != "true" ]; then
                    echo "❌ Sonatype IQ Server failed to become ready after 30 attempts - dumping diagnostics:"
                    echo "--- nxiq directory ---"
                    ls -la "${{ github.workspace }}/nxiq"
                    echo "--- stderr.log ---"
                    cat "${{ github.workspace }}/nxiq/stderr.log" 2>&1 || echo "(no stderr.log)"
                    echo "--- clm-server.log (tail) ---"
                    tail -n 200 "${{ github.workspace }}/nxiq/log/clm-server.log" 2>&1 || echo "(no clm-server.log)"
                    exit 1
                  fi

            - name: Configure Sonatype Nexus Repository Manager to use PostgreSQL
              run: |
                mkdir -p etc/fabric
                echo "username=nexus" > etc/fabric/nexus-store.properties
                echo "password=somepassword" >> etc/fabric/nexus-store.properties
                echo "jdbcUrl=jdbc:postgresql://localhost/nexus" >> etc/fabric/nexus-store.properties
              working-directory: "${{ github.workspace }}/sonatype-work/nexus3"

            - name: Configure Sonatype Nexus Repository Manager for OAuth2 / OIDC
              run: |
                mkdir -p etc
                echo "nexus.security.oauth2.enabled=true" >> etc/nexus.properties
                echo "nexus.jwt.enabled=true" >> etc/nexus.properties
              working-directory: "${{ github.workspace }}/sonatype-work/nexus3"

            - name: Start Sonatype Nexus Repository Manager
              run: ./nexus start
              working-directory: "${{ github.workspace }}/nexus-${{ matrix.nxrm }}/bin"

            - name: Wait for Sonatype Nexus Repository Manager to be ready
              run: |
                  set +e
                  sleep 20
                  while true; do
                    STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8081/service/rest/v1/status")
                    CURL_EXIT=$?

                    echo "CURL Exit Code: $CURL_EXIT"

                    if [ "$CURL_EXIT" -eq 0 ]; then
                      if [ "$STATUS" -eq 200 ]; then
                          echo "✅ Received 200 OK from http://localhost:8081/service/rest/v1/status"
                          break
                      else
                          echo "⏳ Waiting for 200 OK... Current status: $STATUS for http://localhost:8081/service/rest/v1/status"
                          sleep 5
                      fi
                    else
                      echo "⚠️ curl returned unexpected exit code $CURL_EXIT. Retrying..."
                      sleep 5
                    fi
                  done

            - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
              with:
                  go-version-file: 'go.mod'
                  cache: true

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
              with:
                  terraform_version: ${{ matrix.terraform }}
                  terraform_wrapper: false
            - run: go mod download
            - env:
                  NXRM_SERVER_URL: "http://localhost:8081"
                  NXRM_SERVER_USERNAME: "admin"
                  NXRM_SERVER_PASSWORD: "admin123"
                  NXRM_VERSION: "${{ matrix.nxrm }}"
                  TF_ACC: '1'
                  TF_ACC_SINGLE_HIT: '1'
                  TF_ACC_IQ_SERVER: '1'
                  IQ_SERVER_URL: "http://localhost:8070"
                  IQ_SERVER_USERNAME: "admin"
                  IQ_SERVER_PASSWORD: "admin123"
              run: go test -v -cover ./...
              timeout-minutes: 10

            - name: Store nexus.log
              if: success() || failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                name: "nexus.log-nxrm-${{ matrix.nxrm }}-terraform-${{ env.TF_SAFE_VERSION }}"
                path: "${{ github.workspace }}/sonatype-work/nexus3/log/nexus.log"

            - name: Store clm-server.log
              if: success() || failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                name: "clm-server.log-nxrm-${{ matrix.nxrm }}-terraform-${{ env.TF_SAFE_VERSION }}"
                path: "${{ github.workspace }}/nxiq/log/clm-server.log"